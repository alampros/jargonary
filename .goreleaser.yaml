version: 2
project_name: jargonary
builds:
  - main: ./cmd/jargonary
    binary: jargonary
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - examples/config.yaml
      - examples/terms/*.yaml
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: jargonary
    binaries:
      - jargonary
    homepage: https://github.com/alampros/jargonary
    description: Team-owned glossaries in one searchable UI
    skip_upload: auto
    repository:
      owner: alampros
      name: homebrew-tap
      token: '{{ .Env.RELEASE_TOKEN }}'
    caveats: |
      Start with: jargonary -f /path/to/glossary.yaml -format yaml
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/jargonary"]
          end
release:
  draft: false
  replace_existing_artifacts: true
  mode: keep-existing
  prerelease: auto
changelog:
  disable: true
